<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Relay-kit — a structured skill system for coding agents">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669" stop-opacity="0"/><stop offset="1" stop-color="#059669" stop-opacity=".5"/></linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="60%"><stop offset="0" stop-color="#DBF3EA"/><stop offset="1" stop-color="#FAF6EF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="420" fill="#FAF6EF"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- relay flow motif -->
  <g opacity=".9">
    <line x1="760" y1="150" x2="1060" y2="150" stroke="url(#fade)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <line x1="760" y1="220" x2="1120" y2="220" stroke="url(#fade)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <line x1="760" y1="290" x2="1020" y2="290" stroke="url(#fade)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="1060" cy="150" r="5" fill="#059669"/><circle cx="1120" cy="220" r="5" fill="#059669"/><circle cx="1020" cy="290" r="5" fill="#059669"/>
  </g>

  <!-- logo -->
  <g transform="translate(88,86)">
    <rect x="0" y="0" width="80" height="80" rx="21" fill="url(#clay)"/>
    <circle cx="23.2" cy="40" r="6.4" fill="#FBF4EC"/>
    <path d="M34.4 25.6 L49.6 40 L34.4 54.4" fill="none" stroke="#FBF4EC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 25.6 L63.2 40 L48 54.4" fill="none" stroke="#FBF4EC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  </g>
  <text x="188" y="142" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="680" letter-spacing="-1.4" fill="#22201C">relay<tspan fill="#059669">·</tspan>kit</text>

  <!-- headline -->
  <text x="88" y="248" font-family="Georgia, 'Fraunces', serif" font-size="58" font-weight="500" letter-spacing="-1.6" fill="#22201C">Your agent stops guessing.</text>
  <text x="88" y="316" font-family="Georgia, 'Fraunces', serif" font-size="58" font-style="italic" letter-spacing="-1.6" fill="#059669">It works like an engineer.</text>

  <!-- subline -->
  <text x="90" y="366" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6E665A">Route · pull context · apply the right skill · prove the result — before anything is called done.</text>
</svg>
