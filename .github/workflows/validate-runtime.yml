name: Validate Runtime

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fast-tests:
    name: Fast Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-timeout

      - name: Run fast unit tests
        run: python -m pytest tests -q

  validate-runtime:
    name: Full Runtime Verification Gate
    needs: fast-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-timeout

      - name: Validate runtime parity and bundle gating
        run: python scripts/validate_runtime.py

      - name: Run runtime doctor template mode
        if: always()
        run: python relay_kit_public_cli.py runtime doctor . --strict

      - name: Run runtime doctor live mode
        if: always()
        run: python relay_kit_public_cli.py runtime doctor . --strict --state-mode live

      - name: Run migration guard
        if: always()
        run: python relay_kit_public_cli.py migration guard . --strict

      - name: Run naming guard
        if: always()
        run: python scripts/naming_guard.py

      - name: Run policy guard
        if: always()
        run: python relay_kit_public_cli.py policy check . --strict --pack enterprise

      - name: Run SRS guard
        if: always()
        run: python scripts/srs_guard.py . --strict

      - name: Run skill gauntlet
        if: always()
        run: python relay_kit_public_cli.py skill gauntlet . --strict --semantic

      - name: Run workflow eval
        if: always()
        run: python scripts/eval_workflows.py . --strict

      - name: Write trusted manifest evidence
        if: always()
        run: |
          python relay_kit_public_cli.py manifest write .
          python relay_kit_public_cli.py manifest stamp . --issuer ci --channel enterprise

      - name: Run public enterprise doctor
        if: always()
        run: python relay_kit_public_cli.py doctor . --skip-tests --policy-pack enterprise

      - name: Run release lane verification
        if: always()
        run: python relay_kit_public_cli.py release verify .

      - name: Build package smoke wheel
        if: always()
        run: python -m pip wheel . -w .tmp/wheelhouse

      - name: Run package install smoke
        if: always()
        run: python scripts/package_smoke.py .

