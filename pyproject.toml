[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-kit"
version = "4.0.0"
description = "Relay-kit public installer CLI for coding-agent runtime generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Relay-kit" }]
dependencies = [
  "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/b0ydeptraj/Relay-kit"
Repository = "https://github.com/b0ydeptraj/Relay-kit.git"
Issues = "https://github.com/b0ydeptraj/Relay-kit/issues"
Changelog = "https://github.com/b0ydeptraj/Relay-kit/blob/main/CHANGELOG.md"

[project.scripts]
relay-kit = "relay_kit_public_cli:main"

[project.optional-dependencies]
context = [
  "fastembed>=0.6,<1",
  "tree-sitter>=0.22,<1",
  "tree-sitter-language-pack>=0.2,<1",
]

[tool.setuptools]
include-package-data = true
py-modules = [
  "relay_kit",
  "relay_kit_public_cli",
  "relay_kit_compat",
  "relay_kit_cycle_log",
]

[tool.setuptools.packages.find]
include = ["relay_kit_v3*"]

[tool.setuptools.package-data]
relay_kit_v3 = [
  "cli/*.yaml",
  "eval_fixtures/*.json",
  "skill_resources/*/*/*.md",
  "skill_resources/*/*/*.json",
  "dashboard/*",
  "extensions/*",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Backstop against a genuinely hung test (e.g. a doctor->pytest recursion; the
# real guard for that is doctor.py's PYTEST_CURRENT_TEST check). Kept generous
# because the readiness/commercial/release tests legitimately shell out to the
# full gate pipeline and take ~4 minutes.
timeout = 600
timeout_method = "thread"
